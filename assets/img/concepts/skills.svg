.st rect{animation:st 6.0s infinite}
@keyframes st{0%,30%,100%{stroke:#2a3647;fill:#0f1520}2%,28%{stroke:#34d399;fill:#0f1f1b}}
.st.last rect{animation:stl 6.0s infinite}
