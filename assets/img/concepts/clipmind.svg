<style>

.nn{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 6s ease-out infinite}
.nn.n2{animation-delay:.25s}.nn.n3{animation-delay:.5s}
@keyframes draw{0%{stroke-dashoffset:240}22%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.hitbox{animation:hb 3s ease-in-out infinite}
@keyframes hb{0%,100%{stroke-opacity:.7}50%{stroke-opacity:1}}
.q{animation:qp 6s ease-in-out infinite}
@keyframes qp{0%,100%{r:7}50%{r:9}}
.ring{animation:rg 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rg{0%{transform:scale(.4);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.caret{animation:cr 1s steps(1) infinite}
@keyframes cr{50%{opacity:0}}

@media (prefers-reduced-motion: reduce){ *{animation:none!important} }
</style>
